# =====================================================================
# Лимон Медиа — nginx server block
# Файл: /etc/nginx/sites-available/lemon-media
# Симлинк: /etc/nginx/sites-enabled/lemon-media
#
# Этот блок заменяет default-сайт и ловит запросы по IP (5.182.86.152).
# Поддомены matema.pro продолжают работать через свой server-блок.
# Порты VPN (2096/2443/8443) обслуживаются x-ui/xray, nginx их не трогает.
# =====================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Server_name пустой/_ — ловит всё, что не подошло к matema.pro.
    # Можно также явно прописать IP: server_name 5.182.86.152;
    server_name _;

    root /var/www/lemon-media;
    index index.html;

    # Безопасность: базовые заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Скрываем версию nginx
    server_tokens off;

    # Максимальный размер тела запроса (для форм)
    client_max_body_size 2M;

    # =================================================================
    # Чистые URL: /pricing → /pricing.html
    # =================================================================
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # =================================================================
    # Короткий кэш CSS/JS: имена файлов пока не содержат хеш версии.
    # =================================================================
    location ~* \.(?:css|js)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Изображения и шрифты меняются реже, но без immutable до версионирования.
    location ~* \.(?:svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML не кешируем (свежие правки сразу видны)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # =================================================================
    # Кастомный 404
    # =================================================================
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # =================================================================
    # Запрет доступа к служебным файлам
    # =================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Логи
    access_log /var/log/nginx/lemon-media.access.log;
    error_log  /var/log/nginx/lemon-media.error.log;
}

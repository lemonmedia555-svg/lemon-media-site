<!--
  Лимон Медиа — SVG-спрайт иконок.
  Использование: <svg class="ico"><use href="/assets/img/icons.svg#ico-name"/></svg>
  Все иконки в едином стиле: 24×24, stroke 2px, currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="ico-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
      <line x1="11" y1="5" x2="13" y2="5"/>
      <circle cx="12" cy="18.5" r="0.6" fill="currentColor"/>
    </symbol>

    <symbol id="ico-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="14" height="12" rx="2"/>
      <path d="m16 10 6-3v10l-6-3z"/>
    </symbol>

    <symbol id="ico-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5a9.5 9.5 0 1 0 0 19 2.5 2.5 0 0 0 0-5h-1a2 2 0 0 1-2-2 2 2 0 0 1 2-2h3a4 4 0 0 0 4-4 6 6 0 0 0-6-6z"/>
      <circle cx="7" cy="11" r="1" fill="currentColor"/>
      <circle cx="9" cy="6.5" r="1" fill="currentColor"/>
      <circle cx="14" cy="5.5" r="1" fill="currentColor"/>
      <circle cx="17.5" cy="9" r="1" fill="currentColor"/>
    </symbol>

    <symbol id="ico-megaphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11v2a1 1 0 0 0 1 1h3l9 5V5l-9 5H4a1 1 0 0 0-1 1z"/>
      <path d="M19 8.5a4 4 0 0 1 0 7"/>
    </symbol>

    <symbol id="ico-envelope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2"/>
      <path d="m3 7 9 6 9-6"/>
    </symbol>

    <symbol id="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="m21 21-5.5-5.5"/>
    </symbol>

    <symbol id="ico-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="5"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    </symbol>

    <symbol id="ico-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"/>
      <path d="M9 2h6"/>
      <path d="M12 8v5l3 2"/>
    </symbol>

    <symbol id="ico-handshake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 17 7.5 13.5a2.5 2.5 0 0 1 0-3.5l5-5 4 4-1 1"/>
      <path d="m15 11 3 3a2 2 0 0 1 0 2.8 2 2 0 0 1-2.8 0L13 14.5"/>
      <path d="m13 14.5-2 2a2 2 0 0 1-2.8-2.8L10 12"/>
      <path d="m2 14 2-2"/>
      <path d="m20 10 2-2"/>
    </symbol>

    <symbol id="ico-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/>
      <path d="M9 4v16M15 6v16"/>
    </symbol>

    <symbol id="ico-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5v9l9 5 9-5v-9l-9-5z"/>
      <path d="m3 7.5 9 5 9-5"/>
      <path d="M12 12.5v9"/>
    </symbol>

    <symbol id="ico-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"/>
      <rect x="5" y="11" width="3" height="8"/>
      <rect x="10.5" y="6" width="3" height="13"/>
      <rect x="16" y="14" width="3" height="5"/>
    </symbol>

    <symbol id="ico-trending" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 17 7-7 4 4 7-7"/>
      <path d="M14 7h7v7"/>
    </symbol>

    <symbol id="ico-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/>
      <path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
    </symbol>

    <symbol id="ico-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18"/>
      <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>
    </symbol>

    <symbol id="ico-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a4.5 4.5 0 0 0 5.7 5.7L21 14l-7 7-3-3-7 1 1-7 3-3 1-1 4.7-4.7z"/>
    </symbol>

    <symbol id="ico-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2.5V8h5.5"/>
      <path d="M8 13h8M8 17h5"/>
    </symbol>

    <symbol id="ico-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="14" rx="2.5"/>
      <circle cx="12" cy="13" r="4"/>
      <path d="M8 6 9.5 3h5L16 6"/>
    </symbol>

    <symbol id="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12 5 5L20 7"/>
    </symbol>

    <symbol id="ico-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6l12 12M18 6 6 18"/>
    </symbol>

    <symbol id="ico-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 5l7 7-7 7"/>
    </symbol>

    <symbol id="ico-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.5l2.9 5.9 6.6.95-4.8 4.65 1.1 6.55L12 17.55l-5.9 3 1.1-6.55L2.4 9.35l6.6-.95z"/>
    </symbol>

    <!-- Декоративный знак: «лимончик» с листочком — основной брендовый мотив -->
    <symbol id="ico-lemon" viewBox="0 0 48 48" fill="none">
      <ellipse cx="24" cy="28" rx="16" ry="14" fill="#FFDD2D"/>
      <ellipse cx="20" cy="24" rx="4" ry="3" fill="#FFF1A6" opacity=".8"/>
      <path d="M24 12c-1.4 0-2.7.6-3.5 1.6L18 17c-1 1.3.1 3 1.7 3h8.6c1.6 0 2.7-1.7 1.7-3l-2.5-3.4c-.8-1-2.1-1.6-3.5-1.6z" fill="#2EB872"/>
      <path d="M24 13.5c-.9 0-1.7.4-2.2 1.1l-1.4 1.9c-.4.6 0 1.5.8 1.5h5.6c.8 0 1.2-.9.8-1.5l-1.4-1.9c-.5-.7-1.3-1.1-2.2-1.1z" fill="#52D88A" opacity=".5"/>
    </symbol>

    <!-- Лимончиковый паттерн для подложек -->
    <pattern id="pattern-lemons" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="10" fill="#FFDD2D" opacity=".15"/>
      <circle cx="60" cy="60" r="6" fill="#FFDD2D" opacity=".1"/>
      <circle cx="60" cy="20" r="3" fill="#2EB872" opacity=".2"/>
    </pattern>
  </defs>
</svg>
